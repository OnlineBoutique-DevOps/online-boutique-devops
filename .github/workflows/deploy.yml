name: CI/CD Pipeline - Online Boutique (AWS EKS)

on:
  push:
    branches:
      - main
      - master

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: reviewservice
  EKS_CLUSTER_NAME: boutique-cluster
  HELM_RELEASE_NAME: onlineboutique
  HELM_CHART_PATH: ./helm-chart

jobs:
  build-and-deploy:
    name: Build, Push y Deploy a EKS via Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen Docker a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./src/reviewservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./src/reviewservice
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Instalar y configurar Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Validar Helm Chart (Linting)
        run: |
          helm lint ${{ env.HELM_CHART_PATH }}

      - name: Actualizar Kubeconfig para Amazon EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Desplegar en EKS con Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace default \
            --set reviewservice.image.repository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            --set reviewservice.image.tag=${{ github.sha }}
