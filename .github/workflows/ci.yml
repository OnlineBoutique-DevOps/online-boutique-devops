name: CI - Build and Push Docker Images to ECR

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "532727285947"
  AWS_PAGER: ""
  ECR_REGISTRY: 532727285947.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY_PREFIX: online-boutique
  IMAGE_TAG: ${{ github.sha }}
  PUBLISH_IMAGES: ${{ github.event_name == 'push' && github.repository == 'OnlineBoutique-DevOps/online-boutique-devops' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

jobs:
  lint-workflows:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validar workflows y scripts de shell
        uses: docker://rhysd/actionlint:1.7.12

  build-and-push:
    name: Build and Push Docker Images
    needs: lint-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - reviewservice
          - shippingservice
          - shoppingassistantservice
      fail-fast: false

    env:
      SERVICE: ${{ matrix.service }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configurar credenciales de AWS
        if: env.PUBLISH_IMAGES == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login en Amazon ECR
        if: env.PUBLISH_IMAGES == 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.7
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}

      - name: Crear variables de entorno
        run: echo "ECR_REPOSITORY=$ECR_REPOSITORY_PREFIX/$SERVICE" >> "$GITHUB_ENV"

      - name: Construir imagen Docker - ${{ matrix.service }}
        run: |
          # Definir ruta del Dockerfile según el servicio
          case "$SERVICE" in
            "cartservice")
              DOCKER_CONTEXT="./src/cartservice/src"
              ;;
            *)
              DOCKER_CONTEXT="./src/$SERVICE"
              ;;
          esac

          test -f "$DOCKER_CONTEXT/Dockerfile"
          echo "Docker context: $DOCKER_CONTEXT"
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "$DOCKER_CONTEXT"

      - name: Push imagen a ECR - ${{ matrix.service }}
        if: env.PUBLISH_IMAGES == 'true'
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$IMAGE:$IMAGE_TAG"
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Generar resumen de imágenes
        run: |
          {
            echo "## $SERVICE"
            echo "Imagen construida: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            if [[ "$PUBLISH_IMAGES" == "true" ]]; then
              echo "Publicada en ECR con tags $IMAGE_TAG y latest."
            else
              echo "Construcción validada sin credenciales AWS ni publicación en ECR."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
