apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: reviewservice-secret-sync
  namespace: default
spec:
  vaultAuthRef: reviewservice-vault-auth
  mount: kv
  type: kv-v2
  path: reviewservice
  refreshAfter: 60s
  destination:
    create: true
    overwrite: true
    name: reviewservice-secrets
  hmacSecretData: true
