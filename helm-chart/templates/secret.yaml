{{- if not .Values.vaultSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: reviewservice-secrets
  {{- if .Values.vaultSecrets.preserveOnRemoval }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    {{- include "onlineboutique.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_SECRET_KEY: {{ .Values.auth.adminSecretKey | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
